# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: sync-rss

on:
  workflow_dispatch: # manual trigger
    inputs:
      probe_export:
        description: Export full movie history; import only when apply is enabled
        type: boolean
        default: false
      apply:
        description: Insert missing historical marks into NeoDB
        type: boolean
        default: false
  schedule:
    # https://docs.github.com/en/actions/reference/events-that-trigger-workflows#scheduled-events
    # Runs every 6 hours
    - cron:  '0 */6 * * *'

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/previous-releases

    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_MOVIE_DATABASE_ID: ${{ secrets.NOTION_MOVIE_DATABASE_ID }}
      NOTION_MUSIC_DATABASE_ID: ${{ secrets.NOTION_MUSIC_DATABASE_ID }}
      NOTION_BOOK_DATABASE_ID: ${{ secrets.NOTION_BOOK_DATABASE_ID }}
      NOTION_GAME_DATABASE_ID: ${{ secrets.NOTION_GAME_DATABASE_ID }}
      NOTION_DRAMA_DATABASE_ID: ${{ secrets.NOTION_DRAMA_DATABASE_ID }}
      DOUBAN_USER_ID: ${{ secrets.DOUBAN_USER_ID }}
      NEODB_API_TOKEN: ${{ secrets.NEODB_API_TOKEN }}

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm ci
    - name: Verify history parser and merge behavior
      if: inputs.probe_export
      run: node --test scripts/backfill-history.test.mjs
    - name: Export and backfill movie history
      if: inputs.probe_export
      env:
        BACKFILL_APPLY: ${{ inputs.apply }}
      run: node scripts/backfill-history.mjs
    - name: Save history export and import report
      if: ${{ always() && inputs.probe_export }}
      uses: actions/upload-artifact@v4
      with:
        name: douban-history
        path: history-export/
        retention-days: 7
    - run: npm run sync || exit 1
      if: ${{ !inputs.probe_export }}

  keepalive:
    if: ${{ !inputs.probe_export }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Verify keepalive behavior
      run: bash .github/scripts/keepalive.test.sh
    - name: Keep scheduled imports active
      run: bash .github/scripts/keepalive.sh
